<svg width="640" height="150" viewBox="0 0 640 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Akshat Thakur — Product Engineer, Founder of SafeExam. Building software that feels effortless.">
  <style>
    text { transform-box: fill-box; transform-origin: 0% 100%; }
    @media (prefers-reduced-motion: no-preference) {
      .rise { animation: riseIn 560ms cubic-bezier(0.16,1,0.3,1) both; }
      .rise-1 { animation-delay: 0ms; }
      .rise-2 { animation-delay: 160ms; }
      .rise-3 { animation-delay: 300ms; }
      .draw { animation: drawLine 480ms cubic-bezier(0.16,1,0.3,1) 420ms both; }
      @keyframes riseIn { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes drawLine { from { stroke-dashoffset: 40; } to { stroke-dashoffset: 0; } }
    }
  </style>

  <text class="rise rise-1" x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.6" fill="#F5F5F5">Akshat Thakur</text>

  <line class="draw" x1="2" y1="64" x2="42" y2="64" stroke="#6E9CDB" stroke-width="3" stroke-linecap="round" stroke-dasharray="40" stroke-dashoffset="0"/>

  <text class="rise rise-2" x="0" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#ABABAB">Product Engineer · Founder, SafeExam</text>

  <text class="rise rise-3" x="0" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#9A9A9A">Building software that feels effortless.</text>
</svg>
