<svg width="640" height="160" viewBox="0 0 640 160" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Akshat Thakur — Product Engineer, Founder of SafeExam</title>
  <desc>A handcrafted hero composition: name, handwritten accent rule, role, and tagline.</desc>
  <style>
    text { transform-box: fill-box; transform-origin: 0% 100%; }
    .card { transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: no-preference) {
      .rise { animation: riseIn 560ms cubic-bezier(0.16, 1, 0.3, 1) both; }
      .rise-1 { animation-delay: 0ms; }
      .rise-2 { animation-delay: 160ms; }
      .rise-3 { animation-delay: 300ms; }
      .draw { animation: drawLine 480ms cubic-bezier(0.16, 1, 0.3, 1) 420ms both; }
      .card-rise { animation: cardRise 600ms cubic-bezier(0.16, 1, 0.3, 1) both; }
      @keyframes riseIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes drawLine { from { stroke-dashoffset: 28; } to { stroke-dashoffset: 0; } }
      @keyframes cardRise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    }
  </style>

  <rect class="card card-rise" x="52" y="20" width="536" height="120" rx="8" fill="#FAFAFA" stroke="#EDEDED" stroke-width="1"/>

  <g class="rise rise-1">
    <text x="68" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.8" fill="#0B0B0B">Akshat Thakur</text>
  </g>

  <path class="draw" d="M 68,66 Q 76,64 84,66 T 96,66" stroke="#2F5DA6" stroke-width="2.5" stroke-linecap="round" fill="none" stroke-dasharray="28" stroke-dashoffset="28"/>

  <text class="rise rise-2" x="68" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5A5A5A" letter-spacing="-0.1">Product Engineer · Founder, SafeExam</text>

  <text class="rise rise-3" x="68" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#737373">Building software that feels effortless.</text>
</svg>
